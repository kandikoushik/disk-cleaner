name: CI Build & Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-macos:
    name: Build macOS (Swift 5.10)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build macOS App & DMG
        run: |
          chmod +x build.sh
          ./build.sh
      - name: Verify DMG Artifact
        run: test -f out/DiskCleaner-3.0.dmg

  build-windows:
    name: Build Windows (C# .NET)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Build Windows Executable
        run: |
          cd windows
          cmd /c build.bat
