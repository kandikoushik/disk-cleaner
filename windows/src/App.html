<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Disk Cleaner Native (Windows Edition)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="backdrop-orb orb-1"></div>
  <div class="backdrop-orb orb-2"></div>

  <div class="window-container">
    <!-- Breadcrumbs Navigation Header -->
    <div class="breadcrumbs-bar">
      <span style="color: var(--brand); font-weight: 700;">✨ Disk Cleaner</span>
      <span style="opacity: 0.5;">&gt;</span>
      <span id="breadcrumb-current" style="color: var(--text-main); font-weight: 600;">Clean</span>
    </div>
    <div class="hero-banner">
      <div class="mascot-box">
        <span class="mascot-avatar">🤖</span>
        <div class="mascot-speech">
          <div style="font-size: 10px; font-weight: 700; color: var(--brand);">CleanBot Assistant</div>
          <div id="mascot-text" style="font-size: 12px; font-weight: 500;">Ready to scan your Windows system targets! ✨</div>
        </div>
      </div>
      <div>
        <h1 style="font-size: 22px; font-weight: 700;">Disk Cleaner Native</h1>
        <p style="font-size: 13px; opacity: 0.85; margin-top: 4px;">Ultimate Windows Developer & Power-User Cleaning Engine</p>
      </div>
    </div>

    <!-- 9-Tab Navigation -->
    <nav class="tab-bar">
      <button class="tab-btn active" onclick="setTab('clean')">✨ Clean</button>
      <button class="tab-btn" onclick="setTab('explore')">📊 Explore</button>
      <button class="tab-btn" onclick="setTab('spacelens')">☀️ Space Lens</button>
      <button class="tab-btn" onclick="setTab('apps')">📦 Apps</button>
      <button class="tab-btn" onclick="setTab('duplicates')">📄 Duplicates</button>
      <button class="tab-btn" onclick="setTab('privacy')">🔒 Privacy</button>
      <button class="tab-btn" onclick="setTab('shredder')">🗑️ Shredder</button>
      <button class="tab-btn" onclick="setTab('maintenance')">🛠️ Maintenance</button>
      <button class="tab-btn" onclick="setTab('activity')">⚡ Activity</button>
      <button class="tab-btn" onclick="setTab('settings')">⚙️ Settings</button>
    </nav>

    <!-- Dynamic Main Content Area -->
    <main id="content-area" class="glass-card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h2 id="view-title">Clean Targets</h2>
        <button class="btn-primary" onclick="scanTargets()">Rescan Windows Disk</button>
      </div>

      <div id="target-list">
        <!-- Target rows will populate dynamically -->
      </div>
    </main>
  </div>

  <!-- Permanent Immutable Brand Signature Footer -->
  <footer class="dyuthi-footer">
    <span class="dyuthi-icon">🛡️</span>
    <span>Built by Dyuthi Tech Solutions</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
